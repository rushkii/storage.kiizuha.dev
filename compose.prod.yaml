# Production stack: Postgres, migrations, the app and a Cloudflare Tunnel.
# Run with: docker compose -f compose.prod.yaml up -d --build
# Values come from `.env` (see `.env.example`).

x-app-env: &app-env
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    <<: *app-env
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
      args:
        APP_NAME: ${APP_NAME:-Storage}
    <<: *app-env
    restart: unless-stopped
    # Bound to loopback only; public traffic arrives through the tunnel.
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Point the tunnel's public hostname at http://app:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - app

volumes:
  pgdata:
