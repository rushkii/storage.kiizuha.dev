# Production stack: Postgres, migrations and the app. HTTPS is handled by Caddy on the host
# (see `Caddyfile`).
# Values come from `.env` (see `.env.example`).
#
# `app` and `migrate` run the same image. The GitLab pipeline builds it and pushes it to the
# registry, and the deploy job runs `pull` then `up -d` with APP_TAG set to the commit SHA.
# Without APP_TAG, `latest` is used. To build on the server instead, run
# `docker compose -f compose.prod.yaml up -d --build`.

# Own project name, so containers and the `pgdata` volume never mix with the dev stack in
# `compose.yaml`, which shares this folder's default project name.
name: storage-prod

x-app: &app
  image: ${APP_IMAGE:-registry.gnuweeb.net/kiizuha/storage.kiizuha.dev}:${APP_TAG:-latest}
  build:
    context: .
    args:
      APP_NAME: ${APP_NAME:-Storage}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: ['node', 'scripts/migrate.js']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    # Loopback only: just the host's Caddy reaches the app, which keeps `x-real-ip` trustworthy.
    ports:
      - 127.0.0.1:${APP_PORT:-3000}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
